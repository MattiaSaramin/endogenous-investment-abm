# ---------------------------------------------------------------------------
# The rest of tab:marginalturn's derived fractions (brief 27-quinquies 2.1),
# all over ces_b16_turning_points.csv via the `fraction` mode (scale*mean of a
# per-row 0/1 column).  Each was previously a declared blind-spot-#1 derived
# number; registering it moves the number from "asserted, protected by a
# never-correct note" to "verified cell-by-cell by a detector" -- a change of
# CATEGORY, not of coverage (brief 2.4).  In particular 0.771 is the number the
# b19 note kept as a sweep false positive; the METHODOLOGY note is updated to
# say the sweep's ces_b07 pairing stays a coincidence but the number is no
# longer merely asserted.
#
# NOTE (brief 2.3(a)): the brief's 2.1 table also lists 0.299 as
# `anchored_left_of_turn | viable` = 477/1596.  It is NOT registered.  Two
# independent reasons: (i) anchored_left_of_turn is NaN on the 1058 viable
# points where no turn resolves, so `fraction` (= mean, skipna) yields 477/538
# = 0.887, not 477/1596 = 0.299 -- the claim would MISMATCH; and (ii) the
# "0.299" actually printed in 09_sensitivity.tex (l.295) is tab:widesigma's
# chord cell for the sigma-bin 0.649--0.823 (n=201), an unrelated quantity, so a
# 0.299 claim would bind to the wrong referent (a 667003b-style misattribution).
# ---------------------------------------------------------------------------
