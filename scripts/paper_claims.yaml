# Registry of the paper's headline numbers, each with an EXECUTABLE lookup.
#
# One entry per claim.  `verify_paper.py` (paper vs artifact) and `coherence.py`
# (document vs document) both read this file; it is document-agnostic.  A claim
# is checked by `verify_paper.py` iff at least one `appears_in` file is under
# `paper/`; the rest (e.g. brief-17 numbers that live only in METHODOLOGY.md) are
# the concern of `coherence.py`.
#
# Fields:
#   claim_id       unique slug
#   value          the CSV-correct value, rounded ONCE to `decimals` (see below);
#                  null for a deliberately-missing cell (with expect_missing)
#   decimals       how the number is printed in the document; the artifact check
#                  is round(cell, decimals) == value, rounding ONCE from the full
#                  value (a double rounding is exactly the §5 defect)
#   artifact       committed CSV the number is read from
#   filter         column==value selectors applied before reading `column`
#   row_index      (optional) after `filter`, take this 0-based row IN CSV ORDER;
#                  used for tab:delta, whose bins are the SAMPLED edges, so the
#                  match is by row order, not by bin label
#   column         the column whose cell is the number
#   expect_missing (optional) the cell must be NaN/empty (printed "---")
#   symbol         (optional) the paper's own notation -> CSV parameter.  In
#                  tab:sobol the row printed "$\lambda$" is `wealth_effect`, NOT
#                  `expectation_gain`; without this a naive verifier reports a
#                  false MISMATCH, which is worse than no verifier
#   appears_in     list of {file, required}: where the number is asserted.  Built
#                  by REAL grep, not assumed (see the brief-18 report for the two
#                  places the brief's spot-check disagreed with grep)
#
# The tab:sobol Slope column carried three double-rounding transcription errors
# (printed round-TWICE, CSV rounds ONCE). Brief 20 regenerated that table from a
# committed generator (scripts/make_tab_sobol.py); the three claims below now
# hold the round-once value the paper prints and pass like any other.

